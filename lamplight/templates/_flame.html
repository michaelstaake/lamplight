{# The Lamplight mark. Same geometry as static/flame.svg, so the tab icon and
   every in-app appearance are the one shape. #}
{% macro flame(size=22) -%}
<svg class="flame" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32"
     aria-hidden="true" focusable="false">
  <path d="M16 2c4 6 9 8 9 14a9 9 0 0 1-18 0c0-4 2-6 4-9 1 2 2 3 3 3 1-3 1-6 2-8z" fill="#e2a326"/>
  <path d="M16 15c2 2.5 4 4 4 6.5a4 4 0 0 1-8 0c0-2 1.5-3.5 4-6.5z" fill="#f3d27a"/>
</svg>
{%- endmacro %}
